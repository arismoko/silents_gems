[package]
# Ported from: Silent's Gems 5.2.0 (SilentChaos512/SilentGems, MIT), Minecraft Java
# 26.2 NeoForge. Local-only until the maintainer approves publishing.
name = "silentgems"
version = "5.3.9"
edition = "2024"
license = "MIT"
description = "Silent's Gems for Sunrise: gems, storage blocks, ores and redstone lamps"

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod`
# command. The launcher builds against its own copy of the same build.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
